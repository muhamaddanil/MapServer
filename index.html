<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Batas Provinsi Indonesia 1945–1976</title>
<meta name="description" content="Bandingkan perkembangan batas provinsi Indonesia dari 1945 hingga 1976. Data: Badan Informasi Geospasial.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --paper:#f3f1ea; --panel:#fbfaf6; --ink:#16303b; --muted:#5d7079; --line:#d9d6ca;
  --accent:#1f6f78; --warn:#b3401a;
  --serif:"Newsreader",Georgia,serif; --sans:"Public Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0f1c22; --panel:#14262e; --ink:#e6eeee; --muted:#93a6ad; --line:#26404a; --accent:#5fb8c2; --warn:#ff8a5c}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);display:grid;grid-template-columns:340px 1fr;grid-template-rows:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:1000}
header{padding:22px 22px 14px}
h1{font:600 26px/1.15 var(--serif);margin:0 0 8px;letter-spacing:-.01em}
header p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.tools{display:flex;gap:8px;padding:0 22px 12px}
button{font:500 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0 10px;overflow:auto;flex:1}
li label{display:grid;grid-template-columns:20px 44px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
li label:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
li input{accent-color:var(--accent);margin:0}
.sw{height:0;border-top:3px solid var(--c)}
.yr{font-variant-numeric:tabular-nums;font-weight:500}
.st{font-size:11.5px;color:var(--muted)}
.st.err{color:var(--warn)}
footer{padding:14px 22px 18px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
footer a{color:var(--accent)}
#map{height:100%;width:100%;background:var(--paper)}
.leaflet-popup-content{font:14px/1.45 var(--sans);margin:12px 14px}
.leaflet-popup-content b{font:600 16px var(--serif)}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:46% 54%}
  aside{order:2;border-right:0;border-top:1px solid var(--line)}
  #map{order:1}
  header{padding:14px 16px 8px} h1{font-size:21px}
  .tools{padding:0 16px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside>
  <header>
    <h1>Batas provinsi Indonesia, 1945–1976</h1>
    <p>Centang tahun untuk menampilkan garis batas. Aktifkan beberapa tahun sekaligus untuk melihat perubahannya. Klik garis untuk detail.</p>
  </header>
  <div class="tools">
    <button id="all" type="button">Tampilkan semua</button>
    <button id="none" type="button">Kosongkan</button>
  </div>
  <ul id="list" aria-label="Daftar tahun batas provinsi"></ul>
  <footer>
    Sumber: <a href="https://geoservices.big.go.id/gis/rest/services/PTRA/Atlas_Perkembangan_Wilayah_Administrasi/MapServer/6" target="_blank" rel="noopener">Atlas Perkembangan Wilayah Administrasi, Badan Informasi Geospasial</a>.
    Peta dasar © OpenStreetMap, © CARTO.
  </footer>
</aside>
<div id="map" role="application" aria-label="Peta batas provinsi"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SERVICE = "https://geoservices.big.go.id/gis/rest/services/PTRA/Atlas_Perkembangan_Wilayah_Administrasi/MapServer/6/query";
const PROXY = "/api/arcgis";
const YEARS = [1945,1950,1956,1957,1958,1959,1960,1964,1967,1976];
const FIELD = "BTS_ADMIN";
const PAGE = 1000;

// Gradien warna dari tahun tertua (biru-hijau) ke terbaru (jingga-merah)
const from = [42,111,151], to = [214,76,38];
const colorFor = i => {
  const t = i/(YEARS.length-1);
  return "rgb(" + from.map((a,k)=>Math.round(a+(to[k]-a)*t)).join(",") + ")";
};

const map = L.map("map",{zoomControl:true,preferCanvas:true}).setView([-2.5,118],5);
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark?"dark_all":"light_all"}/{z}/{x}/{y}{r}.png`,{
  attribution:"© OpenStreetMap © CARTO",maxZoom:12,subdomains:"abcd"
}).addTo(map);

const layers = {};   // year -> L.GeoJSON
const loaded = {};   // year -> boolean
let useProxy = false;

async function getJSON(params){
  const qs = new URLSearchParams(params).toString();
  if(!useProxy){
    try{
      const r = await fetch(`${SERVICE}?${qs}`);
      if(!r.ok) throw new Error(r.status);
      return await r.json();
    }catch(e){ useProxy = true; }   // kemungkinan CORS, pakai proxy
  }
  const r = await fetch(`${PROXY}?${qs}`);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

async function loadYear(year){
  const features = [];
  let offset = 0, more = true;
  while(more){
    const data = await getJSON({
      where:`${FIELD}='Batas Provinsi Tahun ${year}'`,
      outFields:"*", outSR:4326, f:"geojson",
      resultOffset:offset, resultRecordCount:PAGE,
      maxAllowableOffset:0.002, geometryPrecision:4
    });
    if(data.error) throw new Error(data.error.message||"Kesalahan server");
    features.push(...(data.features||[]));
    more = !!(data.properties?.exceededTransferLimit || data.exceededTransferLimit);
    offset += PAGE;
  }
  return features;
}

const list = document.getElementById("list");
YEARS.forEach((year,i)=>{
  const c = colorFor(i);
  const li = document.createElement("li");
  li.innerHTML = `<label style="--c:${c}">
    <input type="checkbox" data-year="${year}" ${year===1976?"checked":""}>
    <span class="sw" style="${year===1976?"border-top-width:4px":""}"></span>
    <span class="yr">${year}</span>
    <span class="st" id="st-${year}"></span></label>`;
  list.appendChild(li);
});

async function toggle(year,on){
  const st = document.getElementById("st-"+year);
  const i = YEARS.indexOf(year);
  if(!on){ if(layers[year]) map.removeLayer(layers[year]); st.textContent=""; return; }
  if(!loaded[year]){
    st.className="st"; st.textContent="memuat…";
    try{
      const feats = await loadYear(year);
      layers[year] = L.geoJSON({type:"FeatureCollection",features:feats},{
        style:{color:colorFor(i),weight:year===1976?3:2,opacity:.95},
        onEachFeature:(f,l)=>l.bindPopup(`<b>${f.properties[FIELD]||"Batas provinsi "+year}</b><br>Panjang segmen ± ${((f.properties.Shape_Length||0)/1000).toFixed(1)} km`)
      });
      loaded[year]=true;
      st.textContent = feats.length+" garis";
    }catch(e){
      st.className="st err"; st.textContent="gagal"; st.title=String(e.message||e);
      document.querySelector(`[data-year="${year}"]`).checked=false;
      return;
    }
  }
  const box = document.querySelector(`[data-year="${year}"]`);
  if(box.checked){ layers[year].addTo(map); if(year===1976 || !map._fitted){ fit(layers[year]); } }
}
function fit(layer){
  if(map._fitted) return;
  const b = layer.getBounds(); if(b.isValid()){ map.fitBounds(b,{padding:[30,30]}); map._fitted=true; }
}

list.addEventListener("change",e=>{
  if(e.target.matches("input[data-year]")) toggle(+e.target.dataset.year,e.target.checked);
});
document.getElementById("all").onclick = ()=>document.querySelectorAll("input[data-year]").forEach(b=>{ if(!b.checked){b.checked=true; toggle(+b.dataset.year,true);} });
document.getElementById("none").onclick = ()=>document.querySelectorAll("input[data-year]").forEach(b=>{ b.checked=false; toggle(+b.dataset.year,false); });

toggle(1976,true);
</script>
</body>
</html>
